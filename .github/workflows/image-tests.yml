name: Image loading tests

on:
  pull_request:
  push:
    branches: [main, stage3/48-coil-images]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and Android Lint
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Image UI and disk cache tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ee.movara.app.ui.components.MovieImageTest,ee.movara.app.ui.components.MovieImageCacheTest --console=plain
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-test-reports
          path: |
            frontend/app/build/reports/tests/
            frontend/app/build/test-results/
            frontend/app/build/reports/androidTests/
            frontend/app/build/outputs/androidTest-results/
            frontend/app/build/reports/lint-results-debug.*
